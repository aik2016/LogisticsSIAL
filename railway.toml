[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# If a custom start command exists in the Railway UI, remove it so this file wins.
startCommand = "/bin/sh /app/scripts/entrypoint.sh"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10