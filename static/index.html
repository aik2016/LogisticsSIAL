<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logistics Control</title><meta name="codex-deploy-check" content="20261123-railway-auto"><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17313b;background:#f3f6f7}*{box-sizing:border-box}body{margin:0}header{background:#102f3a;color:white;padding:20px 4%;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}h2{font-size:19px;margin:0 0 14px}main{max-width:1450px;margin:auto;padding:26px 4%}nav{display:flex;gap:8px;overflow:auto;margin-bottom:24px}button,.button{border:0;background:#087b80;color:white;border-radius:9px;padding:10px 15px;font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}nav button{background:#dfe9ea;color:#24434b}nav button.active{background:#087b80;color:white}.ghost{background:#e7eff0;color:#17313b}.danger{background:#c64f43}.card{background:white;border:1px solid #dce5e7;border-radius:14px;padding:20px;box-shadow:0 2px 8px #1232  ;margin-bottom:18px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric strong{display:block;font-size:28px;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form .wide{grid-column:1/-1}label{display:block;font-size:14px;font-weight:600}input,select,textarea{width:100%;padding:10px;border:1px solid #c7d5d8;border-radius:8px;background:white;color:#17313b;font:inherit;margin-top:5px}textarea{min-height:70px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;border-bottom:1px solid #e5ecee;text-align:start;vertical-align:top}th{color:#53707a;font-size:13px}section{display:none}section.active{display:block}.tablewrap{overflow:auto}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#e1eeee;color:#126069;font-size:13px}.urgent{background:#ffebe7;color:#a6352e}.muted{color:#5f7880}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.toolbar input{max-width:300px;margin:0}#toast{position:fixed;bottom:20px;right:20px;background:#17313b;color:white;padding:14px 20px;border-radius:10px;display:none;max-width:400px}@media(max-width:800px){.metrics,.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}}@media(max-width:560px){.metrics,.grid,.form{grid-template-columns:1fr}header{padding:16px}main{padding:16px}}
</style></head><body><header><div><h1 id="brand">Logistics Control</h1><small id="subtitle">PO • Inventory • Delivery</small></div><button class="ghost" onclick="language=language==='en'?'ar':'en';render()" id="lang">العربية</button></header><main><nav id="nav"></nav><div id="content"></div></main><div id="toast"></div><script>
let data={},report={},tab='setup',language='en',currentUser=null;const T={en:{setup:'Admin setup',overview:'Overview',pos:'Purchase orders',inventory:'Inventory',invoices:'Invoices',issues:'Issues & tickets',tasks:'Tasks',reports:'Reports',imports:'Imports',settings:'Settings',urgent:'Urgent overdue',reminders:'Due reminders',stock:'Stock',open:'Open POs'},ar:{setup:'إعداد المسؤول',overview:'نظرة عامة',pos:'أوامر الشراء',inventory:'المخزون',invoices:'الفواتير',issues:'المشاكل والتذاكر',tasks:'المهام',reports:'التقارير',imports:'الاستيراد',settings:'الإعدادات',urgent:'المتأخر العاجل',reminders:'تنبيهات الاستحقاق',stock:'المخزون',open:'أوامر مفتوحة'}};const tr=k=>T[language][k]||k;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString();function toast(s){let x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',4500)}async function api(path,method='GET',body){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json','X-Logistics-Request':'1'},body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j}async function load(){try{currentUser=await api('auth/me');data=await api('dashboard');report=currentUser.is_admin||currentUser.permissions.includes('reports_view')?await api('reports'):{};if(!currentUser.is_admin&&tab==='setup')tab='overview';render()}catch(e){if(e.message==='Sign in required')showLogin();else toast(e.message)}}function formObj(f){let x=Object.fromEntries(new FormData(f));for(let k of ['quantity','pcs_per_box','boxes_per_pallet','value','po_id','po_line_id','batch_id'])if(k in x)x[k]=x[k]===''?null:Number(x[k]);return x}async function submit(ev,path,transform){ev.preventDefault();try{let v=formObj(ev.target);await api(path,'POST',transform?transform(v):v);ev.target.reset();await load();toast('Saved')}catch(e){toast(e.message)}}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="muted">No records yet</td></tr>`}</tbody></table></div>`}function opts(rows,value,label){return rows.map(r=>`<option value="${esc(r[value])}">${esc(r[label])}</option>`).join('')}function poTable(rows){return table(['PO','Customer','Region','Due','Qty','Delivered','Value','Status'],rows.map(p=>`<tr><td><b>${esc(p.number)}</b><br><small>${esc(p.item_code?`Line ${p.line_no} · ${p.item_code}`:p.customer_po)}</small></td><td>${esc(p.customer)}</td><td>${esc(p.region)}</td><td>${esc(p.due_date||'—')}</td><td>${fmt(p.ordered_qty)}</td><td>${fmt(p.delivered_qty)}</td><td>${p.value==null?'—':fmt(p.value)}</td><td><span class="pill ${p.urgent?'urgent':''}">${p.urgent?'URGENT':esc(p.source_status||p.status)}</span></td></tr>`))}function field(name,label,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" ${extra}></label>`}function select(name,label,options){return `<label>${label}<select name="${name}">${options}</select></label>`}function section(){if(tab==='setup')return adminSetup();let p=data.pos||[],s=data.stock||[],i=data.invoices||[],l=data.lines||[],b=data.batches||[];if(tab==='overview')return `<div class="metrics"><div class="card metric">${tr('open')}<strong>${p.length}</strong></div><div class="card metric">${tr('urgent')}<strong>${data.urgent.length}</strong></div><div class="card metric">${tr('reminders')}<strong>${data.reminders.length}</strong></div><div class="card metric">${tr('stock')}<strong>${fmt(s.reduce((a,x)=>a+x.free,0))}</strong></div></div><div class="grid"><div class="card"><h2>🚨 ${tr('urgent')}</h2>${poTable(data.urgent)}</div><div class="card"><h2>${tr('reminders')}</h2>${poTable(data.reminders)}</div></div><div class="card"><h2>Recent POs</h2>${poTable(p.slice(-10).reverse())}</div>`;
if(tab==='pos')return `<div class="card"><h2>Add purchase order</h2><form class="form" onsubmit="submit(event,'pos')">${field('number','PO number','text','required')}${select('kind','Type','<option value="marketplace">Marketplace</option><option value="tender">Tender</option>')}${field('customer','Customer')}${field('customer_po','Customer PO')}${field('region','Region')}${field('value','Value','number','step="0.01"')}${field('address','Delivery address')}${field('notes','Notes')}<button>Add PO</button></form></div><div class="card"><h2>Add PO item line / due date</h2><form class="form" onsubmit="event.preventDefault();let v=formObj(event.target);let id=v.po_id;delete v.po_id;api('pos/'+id+'/lines','POST',v).then(load).then(()=>toast('Line saved')).catch(e=>toast(e.message))">${select('po_id','PO',opts(p,'id','number'))}${field('line_no','Line number','text','placeholder="0010" required')}${select('item_code','Item',opts(s,'code','code'))}${field('quantity','Quantity (pieces)','number','min="1" required')}${field('due_date','Due date','date','required')}${field('address','Line delivery address')}<button>Add line</button></form></div><div class="card"><h2>Purchase orders</h2><div class="toolbar"><a class="button ghost" href="/api/export/pos.csv">Export CSV</a></div>${poTable(p)}</div><div class="card"><h2>PO lines</h2>${table(['PO','Line','Item','Qty','Boxes','Pallets','Due','Delivery address'],l.map(x=>`<tr><td>${esc(x.po_number)}</td><td>${esc(x.line_no)}</td><td>${esc(x.item_code)}</td><td>${fmt(x.quantity)}</td><td>${(x.quantity/x.pcs_per_box).toFixed(2)}</td><td>${x.boxes_per_pallet?(x.quantity/x.pcs_per_box/x.boxes_per_pallet).toFixed(2):'—'}</td><td>${esc(x.due_date)}</td><td>${esc(x.address)}</td></tr>`))}</div>`;
if(tab==='inventory')return `<div class="grid"><div class="card"><h2>Add item</h2><form class="form" onsubmit="submit(event,'items')">${field('code','Item code','text','required')}${field('description','Description')}${field('pcs_per_box','Pieces per box','number','min="1" required')}${field('boxes_per_pallet','Boxes per pallet (0 if unknown)','number','min="0" required')}<button>Add item</button></form></div><div class="card"><h2>Receive stock / batch</h2><form class="form" onsubmit="submit(event,'batches')">${select('item_code','Item',opts(s,'code','code'))}${field('batch_no','Batch number','text','required')}${field('quantity','Quantity (pieces)','number','min="0" required')}${field('mfg_date','Manufactured','date')}${field('expiry_date','Expires','date')}<button>Receive</button></form></div></div><div class="card"><h2>Available inventory</h2>${table(['Item','Physical','Booked','Free','Pack','Pallet'],s.map(x=>`<tr><td>${esc(x.code)}</td><td>${fmt(x.physical)}</td><td>${fmt(x.booked)}</td><td><b>${fmt(x.free)}</b></td><td>${fmt(x.pcs_per_box)} pcs/box</td><td>${x.boxes_per_pallet?fmt(x.boxes_per_pallet)+' boxes':'Unknown'}</td></tr>`))}</div><div class="card"><h2>Batches</h2>${table(['ID','Item','Batch','Quantity','Manufactured','Expires'],b.map(x=>`<tr><td>${x.id}</td><td>${esc(x.item_code)}</td><td>${esc(x.batch_no)}</td><td>${fmt(x.quantity)}</td><td>${esc(x.mfg_date)}</td><td>${esc(x.expiry_date)}</td></tr>`))}</div>`;
if(tab==='invoices')return `<div class="card"><h2>Book invoice / reserve stock</h2><p class="muted">Create one invoice line at a time. The invoice must use the PO prefix: M for 300, T for 4600.</p><form class="form" onsubmit="submit(event,'invoices',v=>({...v,lines:[{po_line_id:v.po_line_id,batch_id:v.batch_id,quantity:v.quantity}]}))">${field('number','Odoo invoice number','text','required')}${select('po_id','PO',opts(p,'id','number'))}${select('po_line_id','PO line',l.map(x=>`<option value="${x.id}">${esc(x.po_number)} / ${esc(x.line_no)} / ${esc(x.item_code)}</option>`).join(''))}${select('batch_id','Batch',b.map(x=>`<option value="${x.id}">${esc(x.item_code)} / ${esc(x.batch_no)} (${fmt(x.quantity)})</option>`).join(''))}${field('quantity','Quantity (pieces)','number','min="1" required')}${field('value','Invoice value','number','step="0.01"')}${field('asn_number','ASN number')}${field('asn_date','ASN date','date')}${field('asn_link','ASN link','url')}${field('asn_remarks','ASN remarks')}<button>Book invoice</button></form></div><div class="card"><h2>Invoices</h2>${table(['Invoice','PO','Value','ASN','Status','Next action'],i.map(x=>`<tr><td><b>${esc(x.number)}</b></td><td>${esc(x.po_number)}</td><td>${fmt(x.value)}</td><td>${esc(x.asn_number)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${nextAction(x)}</td></tr>`))}</div><div class="card"><h2>Return stock</h2><form class="form" onsubmit="event.preventDefault();let v=formObj(event.target);if(!confirm('Confirm return to physical stock?'))return;let id=v.invoice_id;delete v.invoice_id;v.confirmed=true;api('invoices/'+id+'/returns','POST',v).then(load).then(()=>toast('Return saved')).catch(e=>toast(e.message))">${select('invoice_id','Invoice',opts(i,'id','number'))}${select('batch_id','Batch',b.map(x=>`<option value="${x.id}">${esc(x.item_code)} / ${esc(x.batch_no)}</option>`).join(''))}${field('quantity','Returned pieces','number','min="1" required')}<button>Return to warehouse</button></form></div>`;
if(tab==='issues')return `<div class="card"><h2>Log a problem or Sada ticket</h2><form class="form" onsubmit="submit(event,'issues')">${select('po_id','PO','<option value="">None</option>'+opts(p,'id','number'))}${select('invoice_id','Invoice','<option value="">None</option>'+opts(i,'id','number'))}${select('type','Problem type','<option>Stock shortage</option><option>Technical</option><option>Delivery</option><option>ASN</option><option>Payment</option><option>Other</option>')}${field('ticket_no','Sada ticket number')}${field('description','Description','text','required')}<button>Save issue</button></form></div><div class="card"><h2>Issues</h2>${table(['Type','Ticket','Description','Status'],data.issues.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.ticket_no)}</td><td>${esc(x.description)}</td><td>${esc(x.status)}</td></tr>`))}</div>`;
if(tab==='tasks')return `<div class="card"><h2>Assign job</h2><form class="form" onsubmit="submit(event,'tasks')">${field('title','Task title','text','required')}${field('assigned_to','Assigned user','text','required')}${select('po_id','PO','<option value="">None</option>'+opts(p,'id','number'))}${field('due_date','Due date','date')}${field('details','Details')}<button>Assign</button></form></div><div class="card"><h2>Tasks</h2>${table(['Task','Assigned to','Due','Status'],data.tasks.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.assigned_to)}</td><td>${esc(x.due_date)}</td><td><select onchange="api('tasks/${x.id}','PATCH',{status:this.value}).then(load).catch(e=>toast(e.message))"><option ${x.status==='open'?'selected':''}>open</option><option ${x.status==='in_progress'?'selected':''}>in_progress</option><option ${x.status==='done'?'selected':''}>done</option></select></td></tr>`))}</div>`;
if(tab==='imports')return `<div class="card"><h2>Import workbooks</h2><p class="muted">Preview before applying. Import PO Masterlist first, then the Sial PO report. Existing PO lines are protected from overwrite. Nupco reports are stored for reconciliation and never auto-change stock or payment.</p><form id="importForm" class="form" onsubmit="importPreview(event)">${select('kind','Workbook type','<option value="masterlist">PO Masterlist</option><option value="sial">Sial PO Report</option><option value="sap">Nupco SAP PO Report</option><option value="gr">Nupco GR Report</option><option value="invoicing">Nupco Invoicing Report</option><option value="invoices">Nupco Invoices Report</option><option value="statement">Nupco Statement of Account</option>')}<label>Excel file<input name="file" type="file" accept=".xlsx" required></label><button>Preview workbook</button></form><div id="importResult"></div><p><button class="ghost" onclick="reconcileNow()">Compare latest SAP report with POs</button></p><div id="reconcileResult"></div></div><div class="card"><h2>Read a PO PDF</h2><p class="muted">Review extracted PO number, item quantities and due dates before adding them manually. Scanned PDFs may need OCR.</p><form class="form" onsubmit="previewPdf(event)"><label>PO PDF<input name="file" type="file" accept=".pdf" required></label><button>Extract details</button></form><div id="pdfResult"></div></div>`;
if(tab==='reports')return `<div class="grid"><div class="card"><h2>PO value by region</h2>${table(['Region','POs','Value'],report.by_region.map(x=>`<tr><td>${esc(x.region)}</td><td>${x.po_count}</td><td>${fmt(x.value)}</td></tr>`))}</div><div class="card"><h2>Quantity by item</h2>${table(['Item','Pieces'],report.by_item.map(x=>`<tr><td>${esc(x.item_code)}</td><td>${fmt(x.quantity)}</td></tr>`))}</div><div class="card"><h2>Invoice pipeline</h2>${table(['Status','Invoices','Value'],report.invoice_status.map(x=>`<tr><td>${esc(x.status)}</td><td>${x.count}</td><td>${fmt(x.value)}</td></tr>`))}</div><div class="card"><h2>Tasks by user</h2>${table(['User','Status','Count'],report.tasks.map(x=>`<tr><td>${esc(x.assigned_to)}</td><td>${esc(x.status)}</td><td>${x.count}</td></tr>`))}</div></div>`;
return settingsView()}function nextAction(x){let map={booked:'dispatched',dispatched:'delivered',delivered:'gr_issued',gr_issued:'uploaded',uploaded:'paid'};let n=map[x.status];return n?`<button onclick="advance(${x.id},'${n}')">Mark ${n.replace('_',' ')}</button>`:'—'}async function advance(id,status){if(!confirm(`Confirm invoice status: ${status}? This may change inventory.`))return;try{await api('invoices/'+id+'/status','PATCH',{status,confirmed:true});await load();toast('Status updated')}catch(e){toast(e.message)}}async function previewPdf(ev){ev.preventDefault();let f=ev.target.querySelector('input[type=file]').files[0],fd=new FormData();fd.append('file',f);try{let r=await fetch('/api/po-pdf/preview',{method:'POST',headers:{'X-Logistics-Request':'1'},body:fd}),j=await r.json();if(!r.ok)throw Error(j.detail||'PDF extraction failed');document.getElementById('pdfResult').innerHTML=`<h2>PO ${esc(j.po_number||'unknown')}</h2>${j.warnings.map(x=>`<p class="urgent">${esc(x)}</p>`).join('')}${table(['Page','Item','Quantity','Due schedules','Address'],j.items.map(x=>`<tr><td>${x.page}</td><td>${esc(x.item_code)}</td><td>${fmt(x.quantity)}</td><td>${x.schedules.map(y=>`${fmt(y.quantity)} · ${esc(y.due_date)}`).join('<br>')}</td><td>${esc(x.address)}</td></tr>`))}`;}catch(e){toast(e.message)}}async function reconcileNow(){try{let j=await api('nupco/reconcile');document.getElementById('reconcileResult').innerHTML=`<h2>SAP comparison</h2><p>${j.sap_source?`Matched ${j.matched_pos} POs. ${j.differences.length} have different quantities or are absent internally.`:'Import a SAP report first.'}</p>${table(['PO','Internal qty','SAP qty','Difference'],j.differences.slice(0,100).map(x=>`<tr><td>${esc(x.po)}</td><td>${x.local_quantity??'—'}</td><td>${x.sap_quantity}</td><td>${x.difference??'—'}</td></tr>`))}`}catch(e){toast(e.message)}}let pendingImport=null;async function importPreview(ev){ev.preventDefault();let f=ev.target.file.files[0],kind=ev.target.kind.value;let fd=new FormData();fd.append('file',f);try{let r=await fetch('/api/'+(['masterlist','sial'].includes(kind)?'import':'nupco')+'/'+kind+'/preview',{method:'POST',headers:{'X-Logistics-Request':'1'},body:fd}),j=await r.json();if(!r.ok)throw Error(j.detail||'Preview failed');pendingImport={kind,file:f};document.getElementById('importResult').innerHTML=`<h2>Preview</h2><p>${j.rows} rows across ${j.distinct_pos} POs. ${j.matched_pos!==undefined?'Matched POs: '+j.matched_pos+'. ':''}Errors: ${j.error_count}. Fingerprint: ${esc(j.fingerprint)}</p>${j.error_count?`<pre>${esc(JSON.stringify(j.errors,null,2))}</pre>`:''}${j.ready?'<button onclick="importApply()">Apply import</button>':''}`;}catch(e){toast(e.message)}}async function importApply(){if(!pendingImport||!confirm('Confirm importing this workbook?'))return;let fd=new FormData();fd.append('file',pendingImport.file);try{let r=await fetch('/api/'+(['masterlist','sial'].includes(pendingImport.kind)?'import':'nupco')+'/'+pendingImport.kind+'/apply',{method:'POST',headers:{'X-Logistics-Request':'1'},body:fd}),j=await r.json();if(!r.ok)throw Error(j.detail||'Import failed');toast(j.already_imported?'This workbook was already imported':`${j.imported_rows} rows imported`);await load()}catch(e){toast(e.message)}}function showLogin(){document.getElementById('nav').innerHTML='';document.getElementById('content').innerHTML=`<div class="card" style="max-width:440px;margin:50px auto"><h2>Sign in</h2><form onsubmit="loginNow(event)">${field('username','Username','text','required')}${field('password','Password','password','required')}<p><button>Sign in</button></p></form><button class="ghost" onclick="showResetRequest()">Forgot password?</button></div>`}function showResetRequest(){document.getElementById('content').innerHTML=`<div class="card" style="max-width:440px;margin:50px auto"><h2>Reset password</h2><p>Enter the email on your account.</p><form onsubmit="sendReset(event)">${field('email','Email','email','required')}<p><button>Send reset link</button></p></form></div>`}async function sendReset(ev){ev.preventDefault();try{await api('auth/reset-request','POST',formObj(ev.target));toast('If this email has an account, a reset link will arrive shortly.')}catch(e){toast(e.message)}}function showResetConfirm(){document.getElementById('nav').innerHTML='';document.getElementById('content').innerHTML=`<div class="card" style="max-width:440px;margin:50px auto"><h2>Choose a new password</h2><form onsubmit="finishReset(event)">${field('password','New password','password','minlength="12" required')}<p><button>Reset password</button></p></form></div>`}async function finishReset(ev){ev.preventDefault();try{await api('auth/reset-confirm','POST',{token:new URLSearchParams(location.search).get('reset'),new_password:formObj(ev.target).password});history.replaceState(null,'','/');toast('Password reset. Sign in now.');showLogin()}catch(e){toast(e.message)}}async function loginNow(ev){ev.preventDefault();try{await api('auth/login','POST',formObj(ev.target));await load()}catch(e){toast(e.message)}}async function logoutNow(){await api('auth/logout','POST',{});currentUser=null;showLogin()}function adminSetup(){return `<div class="card"><h2>Start here, admin</h2><p>Set up and verify the company records before giving access to staff. You are signed in as ${esc(currentUser.username)}.</p></div><div class="grid"><div class="card"><h2>1. Review the packing rules</h2><p>CTND: 250 pieces per box for CTND-200; 12 boxes per pallet.<br>RIM and RIB: 200 pieces per box; 9 boxes per pallet.<br>RIMZP: 100 pieces per box; 14 boxes per pallet.</p><p class="muted">Check any item-specific exceptions in Inventory.</p><button onclick="tab='inventory';render()">Open inventory</button></div><div class="card"><h2>2. Import and check POs</h2><p>Preview PO Masterlist first. Then import the Sial PO report for whole-PO values and statuses. Compare Nupco reports after that.</p><button onclick="tab='imports';render()">Open imports</button></div><div class="card"><h2>3. Enter starting stock</h2><p>Add each batch with its actual quantity, manufacturing date and expiry date. No stock is assumed from a PO.</p><button onclick="tab='inventory';render()">Enter batches</button></div><div class="card"><h2>4. Give staff access</h2><p>Create accounts only after you have reviewed the records. Grant each person the tools needed for their work; you can revoke access later.</p><button onclick="tab='settings';render()">Manage users</button></div></div>`}function passwordCard(){return `<div class="card"><h2>Change my password</h2><form class="form" onsubmit="changeOwnPassword(event)">${field('old_password','Current password','password','required')}${field('new_password','New password','password','minlength="12" required')}<button>Change password</button></form></div>`}async function changeOwnPassword(ev){ev.preventDefault();try{await api('auth/password','POST',formObj(ev.target));toast('Password changed. Sign in again.');showLogin()}catch(e){toast(e.message)}}function settingsView(){if(!currentUser?.is_admin)return passwordCard()+`<div class="card"><h2>Account</h2><p>Signed in as ${esc(currentUser?.username)}</p><button onclick="logoutNow()">Sign out</button></div>`;return passwordCard()+`<div class="card"><h2>Accounts & permissions</h2><p class="muted">Admin can grant or revoke each tool. Create users with a temporary password of 12 or more characters.</p><form class="form" onsubmit="createUser(event)">${field('username','Username','text','required')}${field('password','Temporary password','password','minlength="12" required')}<div class="wide">${['pos_edit','inventory_edit','invoice_edit','issue_edit','task_edit','reports_view','imports_apply','users_manage'].map(p=>`<label style="display:inline-block;margin:7px"><input type="checkbox" name="permission" value="${p}" style="width:auto"> ${p.replace('_',' ')}</label>`).join('')}</div><button>Create user</button></form></div><div class="card"><h2>Existing users</h2><div id="usersList"></div><button class="ghost" onclick="loadUsers()">Refresh users</button></div><div class="card"><button onclick="logoutNow()">Sign out</button></div>`}async function createUser(ev){ev.preventDefault();let f=ev.target;let permissions=[...f.querySelectorAll('input[name=permission]:checked')].map(x=>x.value);try{await api('auth/users','POST',{username:f.querySelector('[name=username]').value,password:f.querySelector('[name=password]').value,permissions});f.reset();toast('User created');loadUsers()}catch(e){toast(e.message)}}async function loadUsers(){try{let users=await api('auth/users');document.getElementById('usersList').innerHTML=table(['Username','Access','Active','Action'],users.map(u=>`<tr><td>${esc(u.username)} ${u.is_admin?'(admin)':''}</td><td>${esc(u.is_admin?'All tools':u.permissions)}</td><td>${u.active?'Yes':'No'}</td><td>${u.is_admin?'—':`<button class="ghost" onclick="editUser(${u.id},'${esc(u.permissions)}',${u.active})">Edit</button> <button class="ghost" onclick="resetUserPassword(${u.id})">Reset password</button>`}</td></tr>`))}catch(e){toast(e.message)}}async function resetUserPassword(id){let password=prompt('Enter a new temporary password (12 or more characters)');if(password===null)return;try{await api('auth/users/'+id,'PATCH',{password});toast('Password changed; user sessions ended')}catch(e){toast(e.message)}}async function editUser(id,permissions,active){let all=['pos_edit','inventory_edit','invoice_edit','issue_edit','task_edit','reports_view','imports_apply','users_manage'];let chosen=prompt('Permissions, separated by commas:\n'+all.join(', '),permissions);if(chosen===null)return;let list=chosen.split(',').map(x=>x.trim()).filter(Boolean);let enabled=confirm(active?'Keep this user active? Select Cancel to revoke all access.':'Activate this user?');try{await api('auth/users/'+id,'PATCH',{permissions:list,active:enabled});toast('Access updated');loadUsers()}catch(e){toast(e.message)}}function render(){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';document.getElementById('lang').textContent=language==='en'?'العربية':'English';document.getElementById('nav').innerHTML=['setup','overview','pos','inventory','invoices','issues','tasks','reports','imports','settings'].filter(k=>k==='overview'||k==='settings'||currentUser?.is_admin||currentUser?.permissions?.includes(({pos:'pos_edit',inventory:'inventory_edit',invoices:'invoice_edit',issues:'issue_edit',tasks:'task_edit',reports:'reports_view',imports:'imports_apply'})[k])).map(k=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${tr(k)}</button>`).join('');document.getElementById('content').innerHTML=section();if(tab==='settings'&&currentUser?.is_admin)loadUsers()}new URLSearchParams(location.search).has('reset')?showResetConfirm():load();
</script></body></html>
